name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: 后端测试（含 Testcontainers 集成测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B test

  frontend:
    name: 前端构建与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: 类型检查与构建
        working-directory: frontend
        run: npm run build
      - name: 单元测试
        working-directory: frontend
        run: npm run test
