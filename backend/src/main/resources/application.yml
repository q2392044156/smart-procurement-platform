server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: procuremind-platform
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/procuremind?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:procuremind}
    password: ${DB_PASSWORD:procuremind123}
    hikari:
      maximum-pool-size: 20
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    baseline-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: audit

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

procuremind:
  security:
    jwt-secret: ${JWT_SECRET:procuremind-demo-secret-at-least-32-bytes-long-change-me}
    access-token-minutes: 30
    refresh-token-days: 7
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:procuremind}
    secret-key: ${MINIO_SECRET_KEY:procuremind123}
    bucket: ${MINIO_BUCKET:procuremind}
  agent:
    enabled: ${AGENT_ENABLED:false}
    base-url: ${AGENT_BASE_URL:http://localhost:8000}
    internal-token: ${AGENT_INTERNAL_TOKEN:change-me}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
