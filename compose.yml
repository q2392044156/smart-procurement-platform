name: procuremind
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: procuremind
      MYSQL_USER: procuremind
      MYSQL_PASSWORD: ${DB_PASSWORD:-procuremind123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build: ./infra/minio
    image: procuremind/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-procuremind}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-procuremind123}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/procuremind?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: procuremind
      DB_PASSWORD: ${DB_PASSWORD:-procuremind123}
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-procuremind}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-procuremind123}
      JWT_SECRET: ${JWT_SECRET:-procuremind-demo-secret-at-least-32-bytes-long-change-me}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://agent:8000}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-change-me}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      backend: { condition: service_healthy }
  agent:
    profiles: ["agent"]
    build: ../procurement-agent-harness
    environment:
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-change-me}
      MCP_SERVER_URL: http://mcp:8001
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: procuremind_agent
      QDRANT_URL: http://qdrant:6333
      HF_ENDPOINT: https://hf-mirror.com
      HF_HOME: /data/hf
    env_file:
      - path: ../procurement-agent-harness/.env
        required: false
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      backend: { condition: service_healthy }
      mcp: { condition: service_started }
      mongo: { condition: service_healthy }
      qdrant: { condition: service_started }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hf-cache:/data/hf
  mcp:
    profiles: ["agent"]
    build: ../procurement-agent-harness
    command: ["python", "-m", "src.mcp_server.server_main"]
    environment:
      ERP_BASE_URL: http://backend:8080
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-change-me}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      QDRANT_URL: http://qdrant:6333
      HF_ENDPOINT: https://hf-mirror.com
      HF_HOME: /data/hf
      KB_STATE_FILE: /app/data/kb_state.json
      KB_BM25_STATS_FILE: /app/data/bm25_stats.json
      KB_COLLECTION: procurement_kb_v2
      KB_RERANKER: llm
      KB_AUTO_SYNC_SECONDS: "120"
    env_file:
      - path: ../procurement-agent-harness/.env
        required: false
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      backend: { condition: service_healthy }
      qdrant: { condition: service_started }
    volumes:
      - hf-cache:/data/hf
      - kb-state:/app/data
  qdrant:
    profiles: ["agent"]
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
  mongo:
    profiles: ["agent"]
    image: mongo:8
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  redis-data:
  minio-data:
  mongo-data:
  qdrant-data:
  hf-cache:
  kb-state:
